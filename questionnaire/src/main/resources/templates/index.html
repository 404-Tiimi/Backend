<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index</title>
</head>
<body>

    <form th:action="@{/inquiry}" method="get">
        <button type="submit">Create inquiry</button>
    </form>

    <h1>Inquiries</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Created</th>
                <th>Deadline</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="inquiry : ${inquiries}">
                <td th:text="${inquiry.id}"></td>
                <td th:text="${inquiry.title}"></td>
                <td th:text="${inquiry.createDate}"></td>
                <td th:text="${inquiry.deadlineDate}"></td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
