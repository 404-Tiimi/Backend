<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>See inquiry</title>
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>
<body class="bg-light">
    <div class="container py-5" style="max-width: 800px;">

    <h1 th:text="${inquiry.title}"></h1>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
    <p>Description:</p>
    <p th:text="${inquiry.description}"></p>

    <p>Author:</p>
    <p>Create date: <span th:text="${inquiry.createDate}"></span></p>
    <p>Deadline date: <span th:text="${inquiry.deadlineDate}"></span></p>
    </div>
    </div>

    <form>
        <div th:each="question, stat : ${inquiry.questions}">
            <label th:for="'q' + ${question.id}"
            th:text="${stat.count} + '. ' + ${question.quest}">Question</label>
            <br>
            <textarea th:if="${question.type == 'TEXT'}" th:id="'q' + ${question.id}"></textarea>
            <div th:if="${question.type == 'RADIO'}">
                <label th:each="opt : ${question.options}" style="display:block">
                    <input type="radio" th:name="'q' + ${question.id}" th:value="${opt}">
                    <span th:text="${opt}"></span>
                </label>
            </div>
        </div>
    </form>

    <a th:href="@{/edit/{id}(id=${inquiry.id})}">
        <button type="button">Edit questionnaire</button>
    </a>

    </div>

</body>
</html>
