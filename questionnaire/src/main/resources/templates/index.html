<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index</title>
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>
<body class="bg-light">

    <div class="container py-5">

    <form th:action="@{/inquiry}" method="get">
        <button type="submit" class="btn btn-primary">Create inquiry</button>
    </form>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Inquiries</h1>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0"> 
                <thead class="table-dark">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Title</th>
                        <th scope="col">Created</th>
                        <th scope="col">Deadline</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="inquiry : ${inquiries}">
                        <td th:text="${inquiry.id}"></td>
                        <td class="fw-semibold" th:text="${inquiry.title}"></td>
                        <td th:text="${inquiry.createDate}"></td>
                        <td th:text="${inquiry.deadlineDate}"></td>
                        <td class="text-end">
                            <a th:href="@{/view/{id}(id= ${inquiry.id})}"><button>View</button></a>
                            <a th:href="@{/edit/{id}(id=${inquiry.id})}"><button>Edit</button></a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(inquiries)}">
                        <td colspan="5" class="text-center text-muted py-4">No inquiries yet.</td>
                    </tr>
                </tbody>
            </table>
         </div>
    </div>
</div>
    
</body>
</html>
