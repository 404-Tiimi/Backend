<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionnaire</title>
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>
<body class="bg-light">

    <div class="container py-5" style="max-width: 800px;">

    <h1 class="mb-4"
     th:text="${inquiry != null} ? 'Edit Questionnaire' : 'Create Questionnaire'">
    </h1>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
        <form th:action="${inquiry != null} ? @{/save} : @{/add}" method="post">
            <input th:if="${inquiry != null}" type="hidden" name="id" th:value="${inquiry.id}">
            <label for="title">Questionnaire title:</label>
            <input id="title" name="title" type="text" class="form-control"
                th:value="${inquiry != null} ? ${inquiry.title} : ''" required>
        </div>
    </div>
    
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-dark text-white">
            <h3 class="mb-0">Questions</h3>
        </div>
    
    <div class="card-body">    
        <div id="question-list">
        <th:block th:if="${inquiry != null}">
            <div th:each="question, stat : ${inquiry.questions}">
                <label th:text="'Question ' + ${stat.count}"></label>
                <input name="questions" type="text"
                       th:value="${question.quest}" placeholder="Write a question">
                <button type="button" class="btn btn-outline-danger" onclick="removeQuestion(this)">Delete</button>
            </div>
    </div>
        </th:block>
    </div>

        <th:block th:unless="${inquiry != null}">
            <div th:each="number : ${#numbers.sequence(1, 5)}">
                <label th:text="'Question ' + ${number}"></label>
                <input name="questions" type="text" placeholder="Write a question">
                <button type="button" onclick="removeQuestion(this)">Delete</button>
            </div>
        </th:block>
        </div>

        <br>
        <div class="d-flex justify-content-between">
            <a th:href="@{/}" class="btn btn-outline-secondary">Cancel</a>
            <button type="button" onclick="addQuestion()">Add question</button>
            <button type="submit">Save questionnaire</button>
        </div>
    </form>
    </div>

    <script>
        let questionNumber = document.querySelectorAll('#question-list > div').length;

        function addQuestion() {
            questionNumber++;

            const question = document.createElement('div');
            question.innerHTML =
                '<label>Question ' + questionNumber + '</label>' +
                '<input name="questions" type="text" placeholder="Write a question">' +
                '<button type="button" onclick="removeQuestion(this)">Delete</button>';

            document.getElementById('question-list').appendChild(question);
        }

        function removeQuestion(button) {
            button.parentElement.remove();
            updateQuestionNumbers();
        }

        function updateQuestionNumbers() {
            const questions = document.querySelectorAll('#question-list > div');
            questionNumber = questions.length;

            questions.forEach((question, index) => {
                question.querySelector('label').textContent = 'Question ' + (index + 1);
            });
        }
    </script>

</body>
</html>
